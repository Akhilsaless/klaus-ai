services:
  - type: web
    name: klaus-ai
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ADVANCED_MODEL
        value: gpt-5.6
      - key: KLAUS_CLOUD_RUNTIME_URL
        sync: false
      - key: KLAUS_CLOUD_RUNTIME_TOKEN
        sync: false
      - key: KLAUS_DESKTOP_PAIRING_ISSUER
        sync: false
      - key: KLAUS_VOICE_RUNTIME_URL
        sync: false
